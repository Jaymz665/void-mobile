name: Build Void Packages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      forced_package:
        description: 'Имя пакета для принудительной сборки'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build inside Void Linux Docker
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/void-packages \
            -w /void-packages \
            -e GITHUB_BASE_REF="${{ github.base_ref }}" \
            -e FORCED_PACKAGE="${{ github.event.inputs.forced_package }}" \
            ghcr.io/void-linux/void-glibc-full:20250616R1 \
            sh -c "
              set -e
              export PATH=\"/opt/xbps/usr/bin:\$PATH\"

              echo '==> Обновление XBPS...'
              xbps-install -Syu xbps
              xbps-install -yu
              xbps-install -y sudo bash git rsync coreutils

              echo '==> Определение пакета для сборки...'
              git config --global --add safe.directory /void-packages

              if [ -n \"\$FORCED_PACKAGE\" ]; then
                PKGS=\"\$FORCED_PACKAGE\"
              else
                # Скачиваем ссылки, чтобы git diff нашел ветки
                git fetch origin main:main || true
                git fetch origin master:master || true

                BASE_REF=\"\${GITHUB_BASE_REF:-main}\"
                if ! git rev-parse --verify \"\$BASE_REF\" >/dev/null 2>&1; then
                  BASE_REF=\"master\"
                fi

                PKGS=\$(git diff --name-only \"\$BASE_REF\"...HEAD 2>/dev/null | grep '^srcpkgs/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
              fi

              if [ -z \"\$PKGS\" ]; then
                echo 'Изменённых шаблонов не найдено, пропускаем сборку.'
                exit 0
              fi

              echo \"==> Найдено для сборки: \$PKGS\"

              # Настройка пользователя builder для xbps-src
              useradd -m builder || true
              chown -R builder:builder /void-packages

              # Инициализация и сборка aarch64
              sudo -Eu builder ./xbps-src binary-bootstrap
              SORTED_PKGS=\$(sudo -Eu builder ./xbps-src sort-dependencies \$PKGS)

              for pkg in \$SORTED_PKGS; do
                echo \"==> Собираем пакет: \$pkg (aarch64)\"
                sudo -Eu builder ./xbps-src -j\$(nproc) -a aarch64 pkg \"\$pkg\"
              done
            "
