name: Build Void Packages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      forced_package:
        description: 'Имя пакета для принудительной сборки (необязательно)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update XBPS and system
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo bash git rsync coreutils

      - name: Detect changed packages
        id: detect
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"

          # Если имя пакета передано вручную при запуске workflow
          if [ -n "${{ github.event.inputs.forced_package }}" ]; then
            echo "::notice::Запущена принудительная сборка для пакета: ${{ github.event.inputs.forced_package }}"
            echo "pkgs=${{ github.event.inputs.forced_package }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Определяем базовый коммит для сравнения
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE_SHA="origin/$GITHUB_BASE_REF"
          else
            BASE_SHA="HEAD~1"
          fi

          echo "Сравниваем с: $BASE_SHA"

          # Ищем изменения только в файлах srcpkgs/<package>/template
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD | grep '^srcpkgs/' | cut -d/ -f2 | sort -u | tr '\n' ' ')

          if [ -z "$CHANGED" ]; then
            echo "Изменённых шаблонов не найдено."
            echo "pkgs=" >> "$GITHUB_OUTPUT"
          else
            echo "Найдены пакеты для сборки: $CHANGED"
            echo "pkgs=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages with xbps-src
        if: steps.detect.outputs.pkgs != ''
        env:
          ARCH: aarch64
          BOOTSTRAP: x86_64
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"

          # Настройка пользователя для работы xbps-src
          useradd -m builder || true
          chown -R builder:builder .

          PKGS="${{ steps.detect.outputs.pkgs }}"
          echo "Запуск сборки для: $PKGS"

          # Инициализация chroot окружения
          sudo -Eu builder ./xbps-src binary-bootstrap

          # Сортировка зависимостей и сборка
          SORTED_PKGS=$(sudo -Eu builder ./xbps-src sort-dependencies $PKGS)

          failed=""
          for pkg in ${SORTED_PKGS}; do
            arch=""
            if [ "$BOOTSTRAP" != "$ARCH" ]; then
              arch="-a $ARCH"
            fi

            if sudo -Eu builder ./xbps-src -j"$(nproc)" $arch pkg "${pkg}"; then
              echo "Успешно собран: ${pkg}"
            else
              echo "!! Ошибка сборки пакета: ${pkg}"
              failed="$failed $pkg"
            fi
          done

          if [ -n "$failed" ]; then
            echo "Следующие пакеты не удалось собрать: $failed"
            exit 1
          fi
