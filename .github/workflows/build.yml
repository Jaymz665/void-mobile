- name: Build all packages in srcpkgs
        env:
          ARCH: aarch64
        run: |
          export PATH="/opt/xbps/usr/bin:$PATH"

          # Получаем список всех папок из srcpkgs
          PKGS=$(ls -1 srcpkgs | tr '\n' ' ')

          if [ -z "$PKGS" ]; then
            echo "Папка srcpkgs пуста."
            exit 0
          fi

          echo "Найдены пакеты для сборки: $PKGS"

          # Инициализируем chroot
          sudo -Eu builder ./xbps-src binary-bootstrap

          # Сортируем с учётом зависимостей и собираем
          SORTED_PKGS=$(sudo -Eu builder ./xbps-src sort-dependencies $PKGS)

          for pkg in $SORTED_PKGS; do
            echo "::group::Сборка $pkg ($ARCH)"
            sudo -Eu builder ./xbps-src -j$(nproc) -a "$ARCH" pkg "$pkg"
            echo "::endgroup::"
          done
