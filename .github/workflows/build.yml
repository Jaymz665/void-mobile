name: Build Void Packages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --privileged

    steps:
      - name: Install runner dependencies
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y libstdc++ bash git sudo rsync coreutils

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build all packages in srcpkgs
        env:
          ARCH: aarch64
        run: |
          export PATH="/opt/xbps/usr/bin:$PATH"

          PKGS=$(ls -1 srcpkgs | tr '\n' ' ')

          if [ -z "$PKGS" ]; then
            echo "Папка srcpkgs пуста."
            exit 0
          fi

          echo "Найдены пакеты для сборки: $PKGS"

          sudo -Eu builder sh -c "cd $GITHUB_WORKSPACE && ./xbps-src binary-bootstrap"

          SORTED_PKGS=$(sudo -Eu builder sh -c "cd $GITHUB_WORKSPACE && ./xbps-src sort-dependencies $PKGS")

          for pkg in $SORTED_PKGS; do
            echo "::group::Сборка $pkg ($ARCH)"
            sudo -Eu builder sh -c "cd $GITHUB_WORKSPACE && ./xbps-src -j\$(nproc) -a $ARCH pkg $pkg"
            echo "::endgroup::"
          done
