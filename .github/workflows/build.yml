name: Build Void packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for aarch64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
    strategy:
      matrix:
        arch: [aarch64]
    steps:
      - name: Prepare container
        run: |
          # Настраиваем репозитории, обновляем систему, ставим нужные пакеты
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git tar openssl xz-utils
          useradd -G xbuilder -M builder || true

      - name: Checkout templates
        uses: actions/checkout@v5
        with:
          path: templates

      - name: Checkout void-packages
        uses: actions/checkout@v5
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Copy custom templates
        run: |
          cp -rv templates/srcpkgs/* void-packages/srcpkgs/
          # Если есть файлы shlibs_append, shlibs_remove — можно добавить позже

      - name: Prepare masterdir and bootstrap
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          # Настройка зеркал и подготовка
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh
          # Дополнительно: bootstrap для кросс-архитектуры
          ./xbps-src binary-bootstrap -A ${{ matrix.arch }}

      - name: Build all packages
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          # Собираем все пакеты из srcpkgs
          for pkg in $(ls ../templates/srcpkgs); do
            sudo -Eu builder ./xbps-src -a $ARCH -j"$(nproc)" pkg $pkg
          done

      - name: Index repository
        working-directory: void-packages
        run: |
          xbps-rindex -a hostdir/binpkgs/*.xbps

      - name: Deploy to repository branch
        working-directory: void-packages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout --orphan repository-${{ matrix.arch }}-glibc
          cp -r hostdir/binpkgs/* .
          git add .
          git commit -m "Update repository for ${{ matrix.arch }}"
          git push --force origin repository-${{ matrix.arch }}-glibc
