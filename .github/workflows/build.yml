name: Build packages

on:
    push:
        branches:
            - main
            - master
        paths:
            - "srcpkgs/**"
            - ".github/workflows/**"
            - "shlibs*"
    workflow_dispatch:

jobs:
    build:
        name: Build packages
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/void-linux/void-${{ matrix.config.libc }}-full:20250616R1
            options: --platform ${{ matrix.config.platform }} --privileged
            volumes:
                - /dev:/dev
            env:
                ARCH: "${{ matrix.config.arch }}"
                BOOTSTRAP: "${{ matrix.config.host }}"
                TEST: "${{ matrix.config.test }}"
        strategy:
            fail-fast: false
            matrix:
                config:
                    - {
                          arch: aarch64,
                          host: x86_64,
                          libc: glibc,
                          platform: linux/amd64,
                          test: 0,
                      }

        permissions:
            contents: write

        steps:
            - name: Prepare container
              run: |
                  # switch to repo-ci mirror
                  mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
                  sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf

                  # Подключение опубликованного репозитория в системный xbps контейнера
                  echo "repository=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.config.arch }}" > /etc/xbps.d/20-custom-repo.conf

                  # install dependencies
                  xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git rsync openssh
                  # create non-root user and subuids for namespaces
                  useradd -G xbuilder -M builder
                  echo "builder:100000:65536" > /etc/subuid
                  echo "builder:100000:65536" > /etc/subgid

            - name: Checkout this repo
              run: |
                  git clone --depth 1 --single-branch "https://github.com/${{ github.repository }}.git" extra
                  cd extra
                  if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
                      git fetch --no-tags origin "${{ github.event.before }}" --depth 1 || true
                  fi
                  git fetch --no-tags origin "${{ github.sha }}" --depth 1
                  git checkout --detach "${{ github.sha }}"

            - name: Determine changed templates
              id: changed
              run: |
                  cd extra

                  base="${{ github.event.before }}"
                  tip="${{ github.sha }}"

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                      changed_pkgs=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f\n" \
                        | tr '\n' ' ')
                      removed_pkgs=""
                  else
                      changed_pkgs=$(git diff --name-only "$base" "$tip" --diff-filter=AM -- 'srcpkgs/*/template' \
                          | cut -d/ -f2 \
                          | sort -u \
                          | tr '\n' ' ')

                      removed_pkgs=$(git diff --name-status "$base" "$tip" -- 'srcpkgs/*/template' \
                          | awk '$1=="D"{print $2}' \
                          | cut -d/ -f2 \
                          | sort -u \
                          | tr '\n' ' ')
                  fi

                  changed_pkgs="${changed_pkgs%% }"
                  removed_pkgs="${removed_pkgs%% }"

                  echo "Changed templates: ${changed_pkgs:-<none>}"
                  echo "Removed templates: ${removed_pkgs:-<none>}"

                  echo "pkgs=$changed_pkgs" >> "$GITHUB_OUTPUT"
                  echo "removed=$removed_pkgs" >> "$GITHUB_OUTPUT"

            - name: Checkout void-packages
              run: |
                  git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages
                  cd void-packages
                  git checkout --detach master

            - name: Merge templates and edit shlibs
              run: |
                  echo "==> copying templates..."
                  if [ -d "extra/srcpkgs" ]; then
                      cp -rv extra/srcpkgs/* void-packages/srcpkgs/
                  fi

                  SHLIBS_FILE="void-packages/common/shlibs"

                  echo "==> updating common/shlibs..."
                  for f in extra/shlibs extra/shlibs_append; do
                      if [ -f "$f" ]; then
                          echo "   + applying $f"
                          tr -d '\r' < "$f" >> "$SHLIBS_FILE"
                          echo "" >> "$SHLIBS_FILE"
                      fi
                  done

                  if [ -f "extra/shlibs_remove" ]; then
                      while IFS= read -r line; do
                          line=$(echo "$line" | tr -d '\r')
                          [ -z "$line" ] && continue
                          grep -vF "$line" "$SHLIBS_FILE" > "$SHLIBS_FILE.tmp" && mv "$SHLIBS_FILE.tmp" "$SHLIBS_FILE"
                          echo "   - removed: $line"
                      done < "extra/shlibs_remove"
                  fi

                  echo "=> applying inline edits..."
                  if [ -d "void-packages/srcpkgs/hyprutils/patches" ]; then
                      echo "   - removing void-packages/srcpkgs/hyprutils/patches"
                      rm -rf void-packages/srcpkgs/hyprutils/patches
                  fi

            - name: Prepare masterdir
              env:
                  PUBLIC_KEY_OF_XBPS_REPO: ${{ secrets.PUBLIC_KEY_OF_XBPS_REPO }}
                  PUBLIC_KEY_OF_XBPS_REPO_NAME: ${{ secrets.PUBLIC_KEY_OF_XBPS_REPO_NAME }}
              run: |
                  cd void-packages

                  if [ -n "$PUBLIC_KEY_OF_XBPS_REPO_NAME" ] && [ -n "$PUBLIC_KEY_OF_XBPS_REPO" ]; then
                      printf '%s' "$PUBLIC_KEY_OF_XBPS_REPO" | base64 -d \
                        > "common/repo-keys/$PUBLIC_KEY_OF_XBPS_REPO_NAME"
                  fi

                  # Allow chroot breakout to bypass unshare restrictions inside container
                  echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf

                  # Добавляем опубликованный репозиторий GitHub Pages внутрь xbps-src
                  echo "repository=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.config.arch }}" >> etc/conf

                  chown -R builder:builder . &&
                  sudo -Eu builder common/travis/set_mirror.sh &&
                  sudo -Eu builder common/travis/prepare.sh &&
                  common/travis/fetch-xtools.sh

            - name: Build
              id: build_step
              run: |
                  export PATH="/opt/xbps/usr/bin/:$PATH"
                  cd void-packages

                  changed="${{ steps.changed.outputs.pkgs }}"
                  removed="${{ steps.changed.outputs.removed }}"

                  if [ -z "$changed" ]; then
                      echo "No changed templates, skipping build."
                      echo "built=" >> "$GITHUB_OUTPUT"
                      echo "failed=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  if [ "$BOOTSTRAP" != "$ARCH" ]; then
                      arch="-a $ARCH"
                  fi

                  if [ "$TEST" = 1 ]; then
                      test="-Q"
                  fi

                  PKGS=$(sudo -Eu builder ./xbps-src $test sort-dependencies $changed)
                  built=""
                  failed=""

                  for pkg in ${PKGS}; do
                      if sudo -Eu builder ./xbps-src -j"$(nproc)" -s $arch $test pkg "${pkg}"; then
                          built="$built $pkg"
                      else
                          echo "!! build failed for ${pkg}"
                          failed="$failed $pkg"
                      fi
                  done

                  built="${built%% }"
                  failed="${failed%% }"

                  echo "Built packages: ${built:-<none>}"
                  echo "Failed packages: ${failed:-<none>}"

                  echo "built=$built" >> "$GITHUB_OUTPUT"
                  echo "failed=$failed" >> "$GITHUB_OUTPUT"

            - name: Index and Deploy to GitHub Pages Repository
              if: success() && steps.build_step.outputs.built != ''
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PRIVATE_KEY_OF_XBPS_REPO: ${{ secrets.PRIVATE_KEY_OF_XBPS_REPO }}
                  PRIVATE_KEY_OF_XBPS_REPO_NAME: ${{ secrets.PRIVATE_KEY_OF_XBPS_REPO_NAME }}
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  mkdir -p deploy
                  git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" deploy || true

                  cd deploy
                  if [ ! -d ".git" ]; then
                      git init
                      git checkout -b gh-pages
                      git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
                  fi

                  touch .nojekyll

                  ARCH_DIR="${{ matrix.config.arch }}"
                  mkdir -p "$ARCH_DIR"

                  # Удаляем лишние x86_64 пакеты и устаревшие индексы хоста
                  rm -f "$ARCH_DIR"/*.x86_64.xbps "$ARCH_DIR"/x86_64-repodata "$ARCH_DIR"/x86_64-repodata.sig

                  # Копируем исключительно бинарники целевой архитектуры
                  cp -v ../void-packages/hostdir/binpkgs/*."${ARCH_DIR}".xbps "$ARCH_DIR/" 2>/devnull || true

                  cd "$ARCH_DIR"

                  # Принудительная генерация aarch64-repodata
                  xbps-rindex -a *."${ARCH_DIR}".xbps
                  xbps-rindex -c .

                  if [ -n "$PRIVATE_KEY_OF_XBPS_REPO" ] && [ -n "$PRIVATE_KEY_OF_XBPS_REPO_NAME" ]; then
                      printf '%s' "$PRIVATE_KEY_OF_XBPS_REPO" | base64 -d > repo.pem
                      xbps-rindex --sign --signedby "$PRIVATE_KEY_OF_XBPS_REPO_NAME" --privkey repo.pem .
                      rm -f repo.pem
                  fi

                  cd ..

                  git add .
                  git commit -m "Re-index aarch64 repository: ${{ github.sha }}" || echo "No changes to commit"
                  git push -u origin gh-pages
