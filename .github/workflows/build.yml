name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build packages (aarch64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      ARCH: aarch64
      BOOTSTRAP: x86_64
      TEST: 0
    permissions:
      contents: write

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git rsync
          useradd -G xbuilder -M builder

      - name: Checkout this repo
        run: |
          git clone --depth 1 --single-branch -b main "https://github.com/${{ github.repository }}.git" extra
          cd extra
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "${{ github.event.before }}" --depth 1 || true
          fi
          git fetch --no-tags origin "${{ github.sha }}" --depth 1
          git checkout --detach "${{ github.sha }}"

      - name: Determine changed templates
        id: changed
        run: |
          cd extra
          base="${{ github.event.before }}"
          tip="${{ github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed_pkgs=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -printf "%f\n" | tr '\n' ' ')
            removed_pkgs=""
          else
            changed_pkgs=$(git diff --name-only "$base" "$tip" --diff-filter=AM -- 'srcpkgs/*/template' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            removed_pkgs=$(git diff --name-status "$base" "$tip" -- 'srcpkgs/*/template' | awk '$1=="D"{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          changed_pkgs="${changed_pkgs%% }"
          removed_pkgs="${removed_pkgs%% }"
          echo "Changed templates: ${changed_pkgs:-<none>}"
          echo "Removed templates: ${removed_pkgs:-<none>}"
          echo "pkgs=$changed_pkgs" >> "$GITHUB_OUTPUT"
          echo "removed=$removed_pkgs" >> "$GITHUB_OUTPUT"

      - name: Checkout void-packages
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages
          cd void-packages
          git checkout --detach master

      - name: Merge templates and edit shlibs
        run: |
          echo "==> copying templates..."
          cp -rv extra/srcpkgs/* void-packages/srcpkgs/

          SHLIBS_FILE="void-packages/common/shlibs"
          APPEND_FILE="extra/shlibs_append"
          REMOVE_FILE="extra/shlibs_remove"

          echo "==> updating common/shlibs..."
          if [ -f "$REMOVE_FILE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              grep -vF "$line" "$SHLIBS_FILE" > "$SHLIBS_FILE.tmp" && mv "$SHLIBS_FILE.tmp" "$SHLIBS_FILE"
              echo "   - removed: $line"
            done < "$REMOVE_FILE"
          fi

          if [ -f "$APPEND_FILE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if ! grep -qF "$line" "$SHLIBS_FILE"; then
                echo "$line" >> "$SHLIBS_FILE"
                echo "   + added: $line"
              fi
            done < "$APPEND_FILE"
          fi

      - name: Prepare masterdir
        run: |
          cd void-packages
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Build changed packages
        id: build_step
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          cd void-packages

          changed="${{ steps.changed.outputs.pkgs }}"
          removed="${{ steps.changed.outputs.removed }}"

          if [ -z "$changed" ]; then
            echo "No changed templates, skipping build."
            echo "built=" >> "$GITHUB_OUTPUT"
            echo "failed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BOOTSTRAP" != "$ARCH" ]; then
            arch="-a $ARCH"
          fi

          if [ "$TEST" = 1 ]; then
            test="-Q"
          else
            test=""
          fi

          PKGS=$(sudo -Eu builder ./xbps-src $test sort-dependencies $changed)
          built=""
          failed=""

          for pkg in ${PKGS}; do
            if sudo -Eu builder ./xbps-src -j"$(nproc)" -s $arch $test pkg "${pkg}"; then
              built="$built $pkg"
            else
              echo "!! build failed for ${pkg}"
              failed="$failed $pkg"
            fi
          done

          built="${built%% }"
          failed="${failed%% }"

          echo "Built packages: ${built:-<none>}"
          echo "Failed packages: ${failed:-<none>}"

          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

          if [ -n "$failed" ]; then
            echo "Some packages failed to build. Exiting with error."
            exit 1
          fi

      - name: Index repository
        working-directory: void-packages
        run: |
          xbps-rindex -a hostdir/binpkgs/*.xbps

      - name: Deploy to GitHub branch
        working-directory: extra
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Удаляем старую ветку, если есть
          git branch -D repository-${{ env.ARCH }}-glibc 2>/dev/null || true
          git checkout --orphan repository-${{ env.ARCH }}-glibc
          # Копируем бинарники
          cp -r ../void-packages/hostdir/binpkgs/* .
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "Update repository for ${{ env.ARCH }}"
            git push --force origin repository-${{ env.ARCH }}-glibc
          fi
