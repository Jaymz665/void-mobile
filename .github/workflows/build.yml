name: Build Void packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for aarch64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --privileged
      volumes:
        - /dev:/dev
    strategy:
      matrix:
        arch: [aarch64]
    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          useradd -G xbuilder -M builder || true

      - name: Checkout templates
        uses: actions/checkout@v5
        with:
          path: templates

      - name: Checkout void-packages
        uses: actions/checkout@v5
        with:
          repository: void-linux/void-packages
          path: void-packages

      - name: Copy custom templates
        run: |
          cp -rv templates/srcpkgs/* void-packages/srcpkgs/

      - name: Apply shlibs modifications
        run: |
          SHLIBS_FILE="void-packages/common/shlibs"
          APPEND_FILE="shlibs_append"
          if [ -f "$APPEND_FILE" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if ! grep -qF "$line" "$SHLIBS_FILE"; then
                echo "$line" >> "$SHLIBS_FILE"
                echo "   + added: $line"
              fi
            done < "$APPEND_FILE"
          fi

      - name: Prepare masterdir and bootstrap
        working-directory: void-packages
        run: |
          chown -R builder:builder .
          sudo -Eu builder common/travis/set_mirror.sh
          sudo -Eu builder common/travis/prepare.sh
          common/travis/fetch-xtools.sh

      - name: Build libcallaudio
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          sudo -Eu builder ./xbps-src -a $ARCH -j"$(nproc)" pkg libcallaudio

      - name: Build gmobile
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          sudo -Eu builder ./xbps-src -a $ARCH -j"$(nproc)" pkg gmobile

      - name: Build remaining packages
        working-directory: void-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          export PATH="/opt/xbps/usr/bin/:$PATH"
          for pkg in $(ls ../templates/srcpkgs | grep -v -e libcallaudio -e gmobile); do
            sudo -Eu builder ./xbps-src -a $ARCH -j"$(nproc)" pkg $pkg
          done

      - name: Index repository
        working-directory: void-packages
        run: |
          xbps-rindex -a hostdir/binpkgs/*.xbps

      - name: Deploy to repository branch
        working-directory: void-packages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout --orphan repository-${{ matrix.arch }}-glibc
          cp -r hostdir/binpkgs/* .
          git add .
          git commit -m "Update repository for ${{ matrix.arch }}"
          git push --force origin repository-${{ matrix.arch }}-glibc
