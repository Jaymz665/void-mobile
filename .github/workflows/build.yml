name: Build packages (aarch64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build packages (aarch64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:20250616R1
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      ARCH: aarch64
      BOOTSTRAP: x86_64
      TEST: 0
    permissions:
      contents: write

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git rsync
          useradd -G xbuilder -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout this repo
        run: |
          git clone --depth 1 --single-branch -b main "https://github.com/${{ github.repository }}.git" extra
          cd extra
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "${{ github.event.before }}" --depth 1 || true
          fi
          git fetch --no-tags origin "${{ github.sha }}" --depth 1
          git checkout --detach "${{ github.sha }}"

      - name: Determine changed templates
        id: changed
        run: |
          cd extra
          base="${{ github.event.before }}"
          tip="${{ github.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            changed_pkgs=$(find srcpkgs -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | tr '\n' ' ')
            removed_pkgs=""
          else
            changed_pkgs=$(git diff --name-only "$base" "$tip" --diff-filter=AM -- 'srcpkgs/*/template' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            removed_pkgs=$(git diff --name-status "$base" "$tip" -- 'srcpkgs/*/template' | awk '$1=="D"{print $2}' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          changed_pkgs="${changed_pkgs%% }"
          removed_pkgs="${removed_pkgs%% }"
          echo "Changed templates: ${changed_pkgs:-<none>}"
          echo "Removed templates: ${removed_pkgs:-<none>}"
          echo "pkgs=$changed_pkgs" >> "$GITHUB_OUTPUT"
          echo "removed=$removed_pkgs" >> "$GITHUB_OUTPUT"

      - name: Checkout void-packages
        run: |
          git clone --depth 1 https://github.com/void-linux/void-packages.git void-packages

      - name: Merge templates and edit shlibs
        run: |
          echo "==> Syncing srcpkgs to void-packages..."
          rsync -av extra/srcpkgs/ void-packages/srcpkgs/

          SHLIBS_FILE="void-packages/common/shlibs"
          APPEND_FILE="extra/shlibs_append"
          REMOVE_FILE="extra/shlibs_remove"

          if [ -f "$REMOVE_FILE" ]; then
            echo "==> Removing shlibs entries..."
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              sed -i "/^${line}/d" "$SHLIBS_FILE"
            done < "$REMOVE_FILE"
          fi

          if [ -f "$APPEND_FILE" ]; then
            echo "==> Appending custom shlibs entries..."
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if ! grep -qF "$line" "$SHLIBS_FILE"; then
                echo "$line" >> "$SHLIBS_FILE"
              fi
            done < "$APPEND_FILE"
          fi

      - name: Prepare masterdir for aarch64
        run: |
          # Передаем владельца папок пользователю builder до вызова скриптов
          chown -R builder:xbuilder void-packages extra

          # Выполняем подтяжку окружения от имени builder
          su builder -c "cd void-packages && common/travis/set_mirror.sh"
          su builder -c "cd void-packages && common/travis/prepare.sh"
          su builder -c "cd void-packages && common/travis/fetch-xtools.sh"
          su builder -c "cd void-packages && ./xbps-src -a $ARCH binary-bootstrap"

      - name: Build changed packages
        id: build_step
        run: |
          changed="${{ steps.changed.outputs.pkgs }}"
          if [ -z "$changed" ]; then
            echo "No changed templates, skipping build."
            exit 0
          fi

          # Сортировка с учётом целевой архитектуры
          PKGS=$(su builder -c "cd void-packages && ./xbps-src -a $ARCH sort-dependencies $changed")
          built=""
          failed=""

          for pkg in ${PKGS}; do
            echo "===> Building $pkg for $ARCH..."
            if su builder -c "cd void-packages && ./xbps-src -a $ARCH -s pkg ${pkg}"; then
              built="$built $pkg"
            else
              echo "!! Build failed for ${pkg}"
              failed="$failed $pkg"
            fi
          done

          built="${built%% }"
          failed="${failed%% }"

          echo "Built packages: ${built:-<none>}"
          echo "Failed packages: ${failed:-<none>}"

          if [ -n "$failed" ]; then
            echo "Some packages failed to build: $failed"
            exit 1
          fi

      - name: Index repository
        run: |
          su builder -c "cd void-packages && xbps-rindex -a hostdir/binpkgs/*.xbps"

      - name: Deploy to GitHub branch
        run: |
          cd extra
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout --orphan repository-${{ env.ARCH }}-glibc || git checkout repository-${{ env.ARCH }}-glibc
          git rm -rf . || true
          cp -r ../void-packages/hostdir/binpkgs/* .
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push"
          else
            git commit -m "Update repository for ${{ env.ARCH }}"
            git push --force origin repository-${{ env.ARCH }}-glibc
          fi
