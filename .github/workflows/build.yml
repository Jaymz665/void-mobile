name: Build Void Packages

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4
        with:
          path: custom-pkgs

      - name: Install XBPS on Ubuntu Host
        run: |
          sudo apt-get update && sudo apt-get install -y git wget

          # Скачиваем статическую сборку xbps
          wget https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz
          mkdir -p /tmp/xbps
          tar -xf xbps-static-latest.x86_64-musl.tar.xz -C /tmp/xbps

          # Добавляем xbps в PATH
          echo "/tmp/xbps/usr/bin" >> $GITHUB_PATH

      - name: Clone void-packages & Prepare
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git void-packages

          if [ -d "custom-pkgs/srcpkgs" ]; then
            cp -a custom-pkgs/srcpkgs/* void-packages/srcpkgs/
          fi

      - name: Build all packages
        env:
          ARCH: aarch64
        run: |
          cd void-packages

          PKGS=$(find "$GITHUB_WORKSPACE/custom-pkgs/srcpkgs" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)

          if [ -z "$PKGS" ]; then
            echo "Пакеты не найдены."
            exit 0
          fi

          echo "Найдены пакеты для сборки: $PKGS"

          # Инициализируем chroot прямо на хосте
          ./xbps-src binary-bootstrap

          # Сортируем с учётом зависимостей
          SORTED_PKGS=$(./xbps-src sort-dependencies $PKGS)

          for pkg in $SORTED_PKGS; do
            echo "::group::Сборка $pkg ($ARCH)"
            ./xbps-src -j$(nproc) -a "$ARCH" pkg "$pkg"
            echo "::endgroup::"
          done
